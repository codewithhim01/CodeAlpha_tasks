<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>✨ Modern Image Gallery</h1>

<!-- FILTER BUTTONS -->

<div class="filters">
    <button onclick="filterSelection('all')">All</button>
    <button onclick="filterSelection('nature')">Nature</button>
    <button onclick="filterSelection('city')">City</button>
    <button onclick="filterSelection('animals')">Animals</button>
</div>

<!-- GALLERY -->

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="gallery-item city">
        <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="gallery-item animals">
        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="gallery-item nature">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="gallery-item city">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1200&auto=format&fit=crop">
    </div>

    <div class="gallery-item animals">
        <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?q=80&w=1200&auto=format&fit=crop">
    </div>

</div>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

    <span class="close">&times;</span>

    <img id="lightbox-img">

    <div class="nav-buttons">
        <button id="prev">⮜ Prev</button>
        <button id="next">Next ⮞</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
